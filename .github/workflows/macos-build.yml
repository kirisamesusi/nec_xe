name: WhateverXe native x86-64 build

# Uploading this file does not start a build. Dispatch requires separate approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whateverxe-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout CI configuration only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .ci
            .github/workflows/macos-build.yml
          sparse-checkout-cone-mode: false
      - name: Select fixed Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
      - name: Verify dependencies, build and run upstream CPU tests
        run: >-
          python .ci/native_build.py
          --work "${{ runner.temp }}/nec-xe-ci-work"
          --output "${{ github.workspace }}/ci-output"
      - name: Preserve isolated build evidence (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whateverxe-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
